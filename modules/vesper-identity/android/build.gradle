apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

// A local Expo module: compileSdk, minSdk and the Kotlin version come from the
// expo-module-gradle-plugin, so this file only names the library and its one
// dependency, Google Play services Block Store (ADR-0048).
group = 'com.gusplayer.vesper.identity'
version = '0.1.0'

expoModule {
  canBePublished false
}

android {
  namespace "com.gusplayer.vesper.identity"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-auth-blockstore:16.4.0"
}
